<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The workshop runs on one shared (desktop) screen; phones render the
       1280px layout zoomed out rather than a broken reflow. -->
  <meta name="viewport" content="width=1280">
  <meta name="description" content="Workshop platform: map your team's personality composition, then design a CustomGPT that fits your team. Utrecht University, School of Economics.">
  <!-- Research tool for invited participants — keep out of search engines. -->
  <meta name="robots" content="noindex">
  <title>Designing Your Digital Teammate — Workshop Platform</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div style="max-width:520px;margin:80px auto;font-family:system-ui,sans-serif;text-align:center;color:#1A1A2E">
      <h1 style="font-size:22px">This workshop needs JavaScript</h1>
      <p>Please enable JavaScript (or use another browser) and reload the page.</p>
    </div>
  </noscript>

  <!-- Vendored libraries (self-hosted: the page makes no external requests) -->
  <script src="js/vendor/react.production.min.js"></script>
  <script src="js/vendor/react-dom.production.min.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/vendor/babel.min.js"></script>

  <!-- App modules: JSX, compiled in the browser by Babel (no build step).
       Order matters — later files use globals defined by earlier ones. -->
  <script type="text/babel" src="js/config.js"></script>
  <script type="text/babel" src="js/constants.js"></script>
  <script type="text/babel" src="js/storage.js"></script>
  <script type="text/babel" src="js/onboarding.js"></script>
  <script type="text/babel" src="js/team-profile.js"></script>
  <script type="text/babel" src="js/design-canvas.js"></script>
  <script type="text/babel" src="js/evaluate.js"></script>
  <script type="text/babel" src="js/export.js"></script>
  <script type="text/babel" src="js/handoff.js"></script>
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
